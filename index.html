<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>FormWheel Vote</title>
<link rel="stylesheet" href="./assets/styles.css">
<link rel="stylesheet" href="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.css">
<script defer src="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.js"></script>
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<meta property="og:title" content="Vote · Formwheel">
<meta property="og:description" content="투표방을 만들고 친구들과 투표하며 실시간 결과를 확인하는 도구.">
<meta property="og:image" content="https://semicolonxss.github.io/Formwheel_Vote/assets/thumbnail.svg">
<link rel="stylesheet" href="assets/formwheel-brand.css?v=20261008-hub-logo">
</head>
<body>
<header class="header">
<a class="logo fw-hub-logo" href="https://semicolonxss.github.io/Formwheel/" aria-label="FormWheel 메인으로 이동"><span class="fw-hub-form">Form</span><span class="fw-hub-icon" aria-hidden="true"></span><span class="fw-hub-wheel">Wheel</span></a>
</header>

<main>
<section class="hero">
<h1>Vote</h1>
<p>간단하게 투표방을 만들고 친구들과 함께 투표해보세요.</p>
</section>

<div id="home">
<div class="card">
<div class="tabs">
<button class="tab active" id="createTab">방 만들기</button>
<button class="tab" id="joinTab">방 참가</button>
</div>

<div id="createBox">
<label>투표 제목</label>
<input id="title" maxlength="80" placeholder="예: 오늘 뭐 먹을까?">

<label>선택지</label>
<div id="choices">
<div class="choice-row"><input maxlength="50" placeholder="선택지 1"><button class="remove" onclick="removeChoice(this)">×</button></div>
<div class="choice-row"><input maxlength="50" placeholder="선택지 2"><button class="remove" onclick="removeChoice(this)">×</button></div>
</div>
<button class="secondary" onclick="addChoice()">+ 선택지 추가</button>
<button class="primary" onclick="createRoom()">투표방 만들기</button>
<div id="createError" class="error"></div>
</div>

<div id="joinBox" class="hidden">
<label>방 코드</label>
<input id="joinCode" maxlength="4" inputmode="numeric" placeholder="4자리 코드">
<label>닉네임</label>
<input id="joinName" maxlength="12" placeholder="닉네임">
<button class="primary" onclick="joinRoom()">참가하기</button>
<div id="joinError" class="error"></div>
</div>
</div>
</div>

<div id="room" class="hidden">
<div class="card center">
<div class="small">방 코드</div>
<div class="code" id="roomCode">----</div>
<div id="hostBadge" class="small"></div>
</div>

<div class="card">
<h2 id="voteTitle"></h2>
<div id="voteState" class="small"></div>
<div id="options"></div>
<button id="voteButton" class="primary" onclick="submitVote()">투표하기</button>
<div id="voteNotice" class="notice hidden"></div>
</div>

<div class="card">
<h3>현재 결과</h3>
<div id="results"></div>
</div>

<div id="hostControls" class="card hidden">
<h3>방장 관리</h3>
<button class="primary" id="startButton" onclick="startVote()">투표 시작</button>
<button class="primary hidden" id="endButton" onclick="endVote()">투표 종료</button>
</div>

<div class="center">
<button class="secondary" onclick="leaveRoom()">나가기</button>
</div>
</div>
</main>

<script type="module" src="./assets/app.js"></script>
</body>
</html>
