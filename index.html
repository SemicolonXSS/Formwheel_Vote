<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>Vote</title>
<link rel="stylesheet" href="./assets/styles.css">
<link rel="stylesheet" href="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.css">
<script defer src="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.js"></script>
<meta property="og:title" content="Vote · Formwheel">
<meta property="og:description" content="투표방을 만들고 친구들과 투표하며 실시간 결과를 확인하는 도구.">
<meta property="og:image" content="https://semicolonxss.github.io/Formwheel_Vote/assets/thumbnail.svg">
<link rel="stylesheet" href="assets/formwheel-brand.css?v=20261008-hub-logo">
<link rel="icon" type="image/svg+xml" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg">
</head>
<body>
<header class="header">
<a class="logo fw-hub-logo" href="https://semicolonxss.github.io/Formwheel/" aria-label="FormWheel 메인으로 이동"><span class="fw-hub-form">Form</span><span class="fw-hub-icon" aria-hidden="true"></span><span class="fw-hub-wheel">Wheel</span></a>
</header>

<main>
<section class="hero">
<h1>Vote</h1>
<p>간단하게 투표방을 만들고 친구들과 함께 투표해보세요.</p>
</section>

<div id="home">
<div class="card">
<div class="tabs">
<button class="tab active" id="createTab">방 만들기</button>
<button class="tab" id="joinTab">방 참가</button>
</div>

<div id="createBox">
<label>투표 제목</label>
<input id="title" maxlength="80" placeholder="예: 오늘 뭐 먹을까?">

<label>선택지</label>
<div id="choices">
<div class="choice-row"><input maxlength="50" placeholder="선택지 1"><button class="remove" onclick="removeChoice(this)">×</button></div>
<div class="choice-row"><input maxlength="50" placeholder="선택지 2"><button class="remove" onclick="removeChoice(this)">×</button></div>
</div>
<button class="secondary" onclick="addChoice()">+ 선택지 추가</button>
<button class="primary" onclick="createRoom()">투표방 만들기</button>
<div id="createError" class="error"></div>
</div>

<div id="joinBox" class="hidden">
<label>방 코드</label>
<input id="joinCode" maxlength="4" inputmode="numeric" placeholder="4자리 코드">
<label>닉네임</label>
<input id="joinName" maxlength="12" placeholder="닉네임">
<button class="primary" onclick="joinRoom()">참가하기</button>
<div id="joinError" class="error"></div>
</div>
</div>
</div>

<div id="room" class="hidden">
<div class="card center">
<div class="small">방 코드</div>
<div class="code" id="roomCode">----</div>
<div id="hostBadge" class="small"></div>
</div>

<div class="card">
<h2 id="voteTitle"></h2>
<div id="voteState" class="small"></div>
<div id="options"></div>
<button id="voteButton" class="primary" onclick="submitVote()">투표하기</button>
<div id="voteNotice" class="notice hidden"></div>
</div>

<div class="card">
<h3>현재 결과</h3>
<div id="results"></div>
</div>

<div id="hostControls" class="card hidden">
<h3>방장 관리</h3>
<button class="primary" id="startButton" onclick="startVote()">투표 시작</button>
<button class="primary hidden" id="endButton" onclick="endVote()">투표 종료</button>
</div>

<div class="center">
<button class="secondary" onclick="leaveRoom()">나가기</button>
</div>
</div>
</main>

<script type="module" src="./assets/app.js"></script>
<script type="module" src="https://semicolonxss.github.io/Formwheel/assets/live-presence.js?v=20261017-duration"></script>

<style id="secol-navigation-style">#secol-scroll-top{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:9000;padding:11px 15px;border:2px solid currentColor;border-radius:999px;background:#fff;color:#202638;font:700 14px system-ui;box-shadow:0 3px 14px #0002;cursor:pointer}#secol-scroll-top[hidden]{display:none!important}#secol-scroll-top:focus-visible{outline:3px solid #ff8c28;outline-offset:3px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}}</style>
<button type="button" id="secol-scroll-top" hidden aria-label="페이지 맨 위로 이동">↑ 맨 위로</button>
<script>(function(){const b=document.getElementById('secol-scroll-top');if(!b)return;let pending=false;function refresh(){pending=false;b.hidden=window.scrollY<420}addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(refresh)}},{passive:true});b.addEventListener('click',()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}));refresh()})();</script>

<style id="secol-share-style">#secol-share-link{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:8000;border:1px solid #aab3c4;border-radius:999px;padding:9px 13px;background:#fff;color:#172033;font:600 13px system-ui;box-shadow:0 2px 10px #0002;cursor:pointer}#secol-share-link:focus-visible{outline:3px solid #e87920;outline-offset:3px}#secol-share-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}</style>
<button type="button" id="secol-share-link" aria-label="현재 프로젝트 링크 공유">🔗 공유</button><span id="secol-share-status" role="status" aria-live="polite"></span>
<script>(function(){const b=document.getElementById('secol-share-link'),status=document.getElementById('secol-share-status');if(!b||!status)return;b.addEventListener('click',async()=>{const url=location.origin+location.pathname;try{if(navigator.share){await navigator.share({title:document.title,url});status.textContent='공유 메뉴를 열었습니다.';return}if(navigator.clipboard&&isSecureContext){await navigator.clipboard.writeText(url);status.textContent='프로젝트 주소가 복사되었습니다.';b.textContent='✓ 복사됨';setTimeout(()=>b.textContent='🔗 공유',2000);return}window.prompt('프로젝트 주소를 복사하세요',url);status.textContent='주소를 확인하세요.'}catch(e){if(e.name!=='AbortError'){window.prompt('프로젝트 주소를 복사하세요',url);status.textContent='주소를 확인하세요.'}}})})();</script>
</body>
</html>
